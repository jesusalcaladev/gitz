name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            zig_target: x86_64-linux-gnu
          - os: ubuntu-latest
            target: linux-aarch64
            zig_target: aarch64-linux-gnu
          - os: macos-latest
            target: macos-x86_64
            zig_target: x86_64-macos
          - os: macos-latest
            target: macos-aarch64
            zig_target: aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Package binary
        run: |
          cd zig-out/bin
          tar -czf gitz-${{ matrix.target }}.tar.gz gitz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitz-${{ matrix.target }}
          path: zig-out/bin/gitz-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find artifacts -name 'gitz-*.tar.gz' -exec cp {} dist/ \;
          cd dist
          ls -la
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
